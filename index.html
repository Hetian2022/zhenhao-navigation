<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>侦豪 · 中转入口</title>
    <style>
        :root {
            --bg: #f5f2f7;
            --text: #211828;
            --muted: #746b7d;
            --card: rgba(255, 255, 255, 0.68);
            --line: rgba(255, 255, 255, 0.55);
            --shadow: 0 24px 70px rgba(111, 80, 135, 0.14);
            --gradient: linear-gradient(180deg, #7c4bd0 0%, #c254c8 38%, #ff4f86 76%, #ffd2c3 100%);
            --chip: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(124, 75, 208, 0.10), transparent 32%),
                radial-gradient(circle at bottom right, rgba(255, 79, 134, 0.08), transparent 28%),
                var(--bg);
            color: var(--text);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 460px;
            background: var(--gradient);
            border-radius: 32px;
            padding: 22px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 24%);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            border-radius: 26px;
            background: rgba(16, 20, 36, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 28px 24px 24px;
            text-align: center;
        }

        .logo {
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.46));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(36, 16, 41, 0.12);
            color: #6f43c8;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: 32px;
            line-height: 1.2;
            letter-spacing: -0.6px;
        }

        .desc {
            margin: 14px auto 0;
            max-width: 320px;
            color: rgba(255, 255, 255, 0.88);
            font-size: 15px;
            line-height: 1.8;
        }

        .group {
            margin-top: 24px;
            display: grid;
            gap: 14px;
        }

        .btn {
            height: 56px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            transition: transform .18s ease, opacity .18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #141018;
            color: #fff;
            box-shadow: 0 14px 30px rgba(20, 16, 24, 0.24);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .links {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--chip);
            color: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 14px;
        }

        .foot {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.78);
            font-size: 13px;
            line-height: 1.7;
        }

        .is-have-image>img {
            width: 30px;
            border-radius: 50%;
            margin-right: 5px;
        }

        @media (max-width: 520px) {
            .wrap {
                padding: 14px;
            }

            .panel {
                padding: 14px;
                border-radius: 24px;
            }

            .card {
                padding: 24px 18px 20px;
                border-radius: 22px;
            }

            .logo {
                width: 72px;
                height: 72px;
                border-radius: 20px;
                font-size: 24px;
            }

            h1 {
                font-size: 28px;
            }

            .desc {
                font-size: 14px;
            }

            .btn {
                height: 52px;
                font-size: 15px;
            }
        }
    </style>
</head>
